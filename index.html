<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Counter Pro — Dual-Type Widescreen Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body data-theme="cyberpunk">
    <!-- Ambient Floating Orbs Background -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container wide-container">
        <!-- Top Header Bar -->
        <div class="calc-header">
            <div class="brand">
                <span class="brand-dot"></span>
                <span class="brand-name">CURRENCY COUNTER PRO</span>
                <span class="version-tag">DUAL-TYPE v3.5</span>
            </div>
            
            <div class="header-controls">
                <!-- Currency Selector Pills -->
                <div class="currency-selector">
                    <button class="curr-btn active" id="currINR" onclick="setCurrency('INR')">₹ INR</button>
                    <button class="curr-btn" id="currUSD" onclick="setCurrency('USD')">$ USD</button>
                    <button class="curr-btn" id="currEUR" onclick="setCurrency('EUR')">€ EUR</button>
                </div>

                <!-- Theme Selector -->
                <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="cyberpunk">🌌 Cyberpunk</option>
                    <option value="violet">🔮 Neon Violet</option>
                    <option value="emerald">🌿 Emerald Gold</option>
                    <option value="midnight">🌙 Midnight Blue</option>
                    <option value="solar">☀️ Solar Light</option>
                </select>
            </div>
        </div>

        <!-- Dual-Type 2-Panel Widescreen Body -->
        <div class="keypad-panels">
            <!-- TYPE 1: PHYSICAL CASH COUNTER (Left Panel) -->
            <div class="panel panel-type-1">
                <div class="panel-header-flex">
                    <div class="panel-title">TYPE 1: PHYSICAL CASH COUNTER</div>
                    <button type="button" class="btn-reset-badge" onclick="resetPhysicalNotes()">Clear Notes</button>
                </div>

                <!-- Physical Cash Note Cards Grid -->
                <div class="notes-grid-compact" id="notesGrid">
                    <!-- Rendered dynamically by Script.js -->
                </div>

                <!-- Type 1 Total Cash Display & Words Box -->
                <div class="total-card">
                    <div class="card-label">PHYSICAL CASH TOTAL</div>
                    <div id="total" class="total-display">💰 ₹0</div>
                    <div id="wordsResult" class="words-display">Zero Rupees Only</div>
                </div>
            </div>

            <!-- TYPE 2: TARGET AMOUNT BREAKDOWN (Right Panel) -->
            <div class="panel panel-type-2">
                <div class="panel-header-flex">
                    <div class="panel-title">TYPE 2: TARGET BREAKDOWN GENERATOR</div>
                    <button type="button" class="btn-reset-badge" onclick="resetBreakdown()">Clear Target</button>
                </div>
                
                <!-- Target Amount Input Box -->
                <div class="input-box">
                    <input type="number" id="amount" placeholder=" " oninput="countNotes()">
                    <label id="inputLabel">Enter Target Amount</label>
                </div>

                <!-- Type 2 Breakdown Total & Words Display -->
                <div class="total-card breakdown-total-card">
                    <div class="card-label">BREAKDOWN TARGET TOTAL</div>
                    <div id="breakdownTotal" class="total-display alt-total">🎯 ₹0</div>
                    <div id="breakdownWords" class="words-display">Zero Rupees Only</div>
                </div>

                <!-- Breakdown Output Container -->
                <div id="result" class="breakdown-display">
                    <span class="muted-hint">Enter a target amount above to generate optimal note breakdown.</span>
                </div>

                <!-- Action Button Bar -->
                <div class="action-bar">
                    <button type="button" class="btn btn-primary" onclick="countNotes()">Generate Note Breakdown</button>
                </div>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>

</html>
