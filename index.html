<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Counter Pro — Widescreen Western Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Ambient Background Light Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container">
        <!-- Header & Currency Selector -->
        <div class="header">
            <div class="brand">
                <span class="brand-dot"></span>
                <span class="brand-name">CURRENCY COUNTER PRO</span>
            </div>
            <div class="currency-selector">
                <button class="curr-btn active" id="currINR" onclick="setCurrency('INR')">₹ INR</button>
                <button class="curr-btn" id="currUSD" onclick="setCurrency('USD')">$ USD</button>
                <button class="curr-btn" id="currEUR" onclick="setCurrency('EUR')">€ EUR</button>
            </div>
        </div>

        <!-- Target Amount Input Box -->
        <div class="input-box">
            <input type="number" id="amount" placeholder=" " oninput="countNotes()">
            <label id="inputLabel">Enter Amount for Breakdown</label>
        </div>

        <div class="section-title">Physical Note Denominations</div>

        <!-- Dynamic Note Grid -->
        <div class="notes" id="notesGrid">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- Action Buttons -->
        <div class="buttons">
            <button class="btn btn-primary" onclick="countNotes()">Breakdown Notes</button>
            <button class="btn btn-secondary" onclick="resetAll()">Reset All</button>
        </div>

        <!-- Total Display & English Words Result Box -->
        <div class="result-box">
            <div id="total" class="total-display">💰 ₹0</div>
            <div id="wordsResult" class="words-display">Zero Rupees Only</div>
            <div id="result" class="breakdown-display"></div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>

</html>
