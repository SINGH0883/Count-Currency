<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Counter Pro — Ultra Widescreen Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body data-theme="cyberpunk">
    <!-- Ambient Floating Orbs Background -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container wide-container">
        <!-- Top Header Bar -->
        <div class="calc-header">
            <div class="brand">
                <span class="brand-dot"></span>
                <span class="brand-name">CURRENCY COUNTER PRO</span>
                <span class="version-tag">PRO v3.0</span>
            </div>
            
            <div class="header-controls">
                <!-- Currency Selector Pills -->
                <div class="currency-selector">
                    <button class="curr-btn active" id="currINR" onclick="setCurrency('INR')">₹ INR</button>
                    <button class="curr-btn" id="currUSD" onclick="setCurrency('USD')">$ USD</button>
                    <button class="curr-btn" id="currEUR" onclick="setCurrency('EUR')">€ EUR</button>
                </div>

                <!-- Theme Switcher -->
                <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="cyberpunk">🌌 Cyberpunk</option>
                    <option value="violet">🔮 Neon Violet</option>
                    <option value="emerald">🌿 Emerald Gold</option>
                    <option value="midnight">🌙 Midnight Blue</option>
                    <option value="solar">☀️ Solar Light</option>
                </select>
            </div>
        </div>

        <!-- Ultra-Wide 2-Panel Body -->
        <div class="keypad-panels">
            <!-- Left Panel: Total & English Words Overview (Width: 42%) -->
            <div class="panel panel-left">
                <div class="panel-title">TOTAL & WORDS OVERVIEW</div>
                
                <!-- Target Amount Input Box -->
                <div class="input-box">
                    <input type="number" id="amount" placeholder=" " oninput="countNotes()">
                    <label id="inputLabel">Enter Amount for Breakdown</label>
                </div>

                <!-- Total Cash Glow Card -->
                <div class="total-card">
                    <div id="total" class="total-display">💰 ₹0</div>
                    <div id="wordsResult" class="words-display">Zero Rupees Only</div>
                </div>

                <!-- Breakdown Result Output -->
                <div id="result" class="breakdown-display">
                    <span class="muted-hint">Type note counts on the right or enter a target amount above.</span>
                </div>
            </div>

            <!-- Right Panel: Denomination Note Input Cards (Width: 58%) -->
            <div class="panel panel-right">
                <div class="panel-header-flex">
                    <div class="panel-title">PHYSICAL CASH DENOMINATIONS</div>
                    <button class="btn-reset-link" onclick="resetAll()">Reset All</button>
                </div>

                <!-- 4 Columns x 2 Rows Compact Note Grid -->
                <div class="notes-grid-compact" id="notesGrid">
                    <!-- Rendered dynamically by Script.js -->
                </div>

                <!-- Action Button Bar -->
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="countNotes()">Compute Denomination Breakdown</button>
                </div>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>

</html>
